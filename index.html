<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Loveyyy</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f5; /* Lavender Blush */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        .container {
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        h1 {
            color: #d02090;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .heart-icon {
            font-size: 80px;
            animation: pulse 1.5s infinite;
            margin-bottom: 20px;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 100px;
        }

        button {
            padding: 15px 35px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #ff69b4;
            color: white;
            z-index: 100;
        }

        #yesBtn:hover {
            background-color: #ff1493;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #a9a9a9;
            color: white;
            position: absolute; /* Allows it to move anywhere */
            transition: all 0.1s ease;
        }

        .success-message {
            display: none;
            font-size: 3rem;
            color: #ff1493;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="heart-icon">💖</div>
        <h1 id="question">Hi Loveyyy, will you be my valentine?</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const question = document.getElementById('question');
        const body = document.body;

        // Function to move the "No" button
        function moveNoButton() {
            // Padding to keep the button away from the absolute edges
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.floor(Math.random() * maxX) + (padding/2);
            const randomY = Math.floor(Math.random() * maxY) + (padding/2);
            
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Move on hover (desktop)
        noBtn.addEventListener('mouseenter', moveNoButton);
        
        // Move on tap (mobile)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function celebrate() {
            // Change the text and hide the "No" button
            question.innerHTML = "Yay! You're stuck with me now! 🥰❤️";
            noBtn.style.display = 'none';
            
            // Visual flair
            body.style.backgroundColor = "#ffc0cb";
            yesBtn.style.transform = "scale(2)";
            yesBtn.disabled = true;
            yesBtn.innerHTML = "Forever! ✨";
            
            // Optional: Create a shower of hearts? (Let me know if you want that!)
        }
    </script>
</body>
</html>
